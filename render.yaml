# Render Blueprint for remote testing with a local backend.
# See docs/REMOTE_TESTING.md.
#
# ONE EDIT REQUIRED: replace the tunnel host below with your public tunnel URL
# (e.g. your ngrok static domain or a named Cloudflare Tunnel host). The frontend
# is served from Render's CDN; /api/* is proxied server-side to your machine so
# session and CSRF cookies stay first-party in the browser.
services:
  - type: web
    name: ideaforge-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      # API -> local backend through the tunnel (must be listed first).
      - type: rewrite
        source: /api/*
        destination: https://REPLACE-WITH-YOUR-TUNNEL.ngrok-free.app/api/*
      # SPA client-side routing fallback.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
